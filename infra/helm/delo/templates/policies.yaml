apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: delo-default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: delo-dns}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: delo-internal}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {}}]
      ports: [{port: 8080}, {port: 5432}]
  egress:
    - to: [{podSelector: {}}]
      ports: [{port: 8080}, {port: 5432}]
{{- if gt (int .Values.replicas) 1 }}
{{- range $name := list "api" "web" "worker" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: delo-{{ $name }}}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: delo-{{ $name }}}
{{- end }}
{{- end }}
