apiVersion: v1
kind: Service
metadata: {name: delo-db}
spec:
  selector: {app: delo-db}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: delo-db}
spec:
  serviceName: delo-db
  replicas: 1
  selector:
    matchLabels: {app: delo-db}
  template:
    metadata:
      labels: {app: delo-db}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17.6-alpine
          env:
            - {name: POSTGRES_DB, value: delo}
            - {name: POSTGRES_USER, value: delo}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: delo-db, key: password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          readinessProbe:
            exec: {command: [pg_isready, -U, delo]}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
