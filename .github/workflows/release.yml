name: publish-dev-images
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [codex/dev]
permissions:
  contents: read
  packages: write
jobs:
  images:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [identity, contacts, organizations, education, bookings, subscriptions, finance, artworks, inventory, exhibitions, reports, audit, notifications, gateway, worker, admin, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize registry path
        id: names
        shell: bash
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish service image
        env:
          IMAGE_PREFIX: ghcr.io/${{ steps.names.outputs.repository }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          PUSH: 'true'
        run: sh scripts/build-images.sh "${{ matrix.component }}"
