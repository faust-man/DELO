name: publish-dev-images
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [codex/dev]
permissions:
  contents: read
  packages: write
jobs:
  images:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix: {component: [backend, frontend]}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize registry path
        id: names
        shell: bash
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repository }}-${{ matrix.component }}:${{ github.event.workflow_run.head_sha }}
      - run: echo '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
